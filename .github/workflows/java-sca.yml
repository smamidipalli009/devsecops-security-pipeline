name: Java - SCA (Trivy)

on:
  push:
    branches: [main]
    paths: [src/java/**]
  pull_request:
    branches: [main]
    paths: [src/java/**]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/java-app

jobs:
  sca-trivy-java:
    name: Trivy - Java image
    runs-on: [self-hosted, Linux, X64, secops_machine]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup stale containers and images
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          docker rm -f java-app 2>/dev/null || true
          docker rmi -f java-app:sca 2>/dev/null || true
          docker images | grep java-app || echo "no java images"

      - name: Build Java Docker image
        run: |
          cd $GITHUB_WORKSPACE/src/java
          echo "PWD=$(pwd)"
          ls -la
          docker build -t java-app:sca .
          docker images | grep java-app

      - name: Trivy scan - full report (table)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: java-app:sca
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy scan - SARIF for Security tab
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: java-app:sca
          format: sarif
          output: trivy-java.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-java.sarif
          category: sca-java

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: java-app:sca
          format: cyclonedx
          output: sbom-java.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-java
          path: sbom-java.json

      - name: Trivy gate - fail on HIGH/CRITICAL fixable
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: java-app:sca
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag java-app:sca ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
          docker tag java-app:sca ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
