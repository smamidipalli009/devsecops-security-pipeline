name: Python — SAST (CodeQL)

# Scans src/python/ source code on every push and PR.
# No build step needed — Python is interpreted.
# Other languages have their own workflow files:
#   java-sast.yml, dotnet-sast.yml, php-sast.yml

on:
#  push:
#    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"   # weekly re-scan (new CodeQL rules ship regularly)
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-python:
    name: CodeQL — Python
    runs-on: [ self-hosted, Linux, X64, secops_machine ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended
          source-root: src/python

      # No autobuild step needed — Python is interpreted, not compiled.

      # codeql-action/analyze automatically uploads SARIF to the Security tab.
      # Do NOT add a separate upload-sarif step — it causes a duplicate
      # upload error: "only one run per category allowed per job."
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: sast-python
