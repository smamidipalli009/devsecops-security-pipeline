name: Python — SAST (CodeQL)

# Scans src/python/ source code on every push and PR.
# No build step needed — Python is interpreted.
# Other languages have their own workflow files:
#   java-sast.yml, dotnet-sast.yml, php-sast.yml

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 7 * * 1"   # weekly re-scan (new CodeQL rules ship regularly)
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write   # required to upload SARIF to Security tab
  actions: read

jobs:
  # -----------------------------------------------------------------------
  # Python SAST
  # Detects: SQL injection, command injection, path traversal,
  #          hardcoded credentials, Flask debug mode, and more.
  # No build step needed — Python is interpreted.
  # -----------------------------------------------------------------------
  codeql-python:
    name: CodeQL — Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # 'security-extended' adds more rules on top of the default set.
          # Trade-off: more findings, slightly more noise — good for a demo
          # because it surfaces more issues to talk about.
          queries: security-extended
          source-root: src/python

      # No autobuild step needed for Python — CodeQL traces interpreted files directly.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: sast-python
          output: codeql-python-results.sarif

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: codeql-python-results.sarif
          category: sast-python


