name: Go - SCA (Trivy)

on:
#  push:
#    branches: [main]
#    paths: [src/go/**]
  pull_request:
    branches: [main]
    paths: [src/go/**]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/go-app

jobs:
  sca-trivy-go:
    name: Trivy - Go image
    runs-on: [self-hosted, Linux, X64, secops_machine]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup stale containers and images
        run: |
          cd $GITHUB_WORKSPACE
          docker rm -f go-app 2>/dev/null || true
          docker rmi -f go-app:sca 2>/dev/null || true
          docker images | grep go-app || echo "no go images"

      - name: Build Go Docker image
        run: |
          cd $GITHUB_WORKSPACE/src/go
          echo "PWD=$(pwd)"
          ls -la
          docker build --progress=plain -t go-app:sca .
          docker images | grep go-app

      - name: Trivy scan - full report
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: go-app:sca
          format: table
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Trivy scan - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: go-app:sca
          format: sarif
          output: trivy-go.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-go.sarif
          category: sca-go

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: go-app:sca
          format: cyclonedx
          output: sbom-go.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-go
          path: sbom-go.json

      - name: Trivy gate - fail on HIGH/CRITICAL fixable
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: go-app:sca
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        if: github.event_name != 'pull_request'
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          docker tag go-app:sca ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
          docker tag go-app:sca ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ github.sha }}
