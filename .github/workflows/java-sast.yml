name: Java - SAST (CodeQL)

# Java needs a build step — CodeQL compiles the code to analyze it.
# Unlike Python/PHP, Java is compiled so CodeQL must trace the build.

on:
  push:
    branches: [main]
    paths: [src/java/**]
  pull_request:
    branches: [main]
    paths: [src/java/**]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-java:
    name: CodeQL - Java
    runs-on: [self-hosted, Linux, X64, secops_machine]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify workspace
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          ls -la $GITHUB_WORKSPACE/src/java/

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          queries: security-extended
          source-root: src/java

      # Java REQUIRES a build step — CodeQL traces the compilation
      - name: Build with Maven (CodeQL traces this)
        run: |
          cd $GITHUB_WORKSPACE/src/java
          echo "PWD=$(pwd)"
          mvn compile -q

      # codeql/analyze uploads SARIF automatically — no separate upload step
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: sast-java
