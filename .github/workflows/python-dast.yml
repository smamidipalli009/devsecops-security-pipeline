name: Python — DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: [ "Python — SCA (Trivy)" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dast-zap-python:
    name: OWASP ZAP — Python app
    runs-on: [ self-hosted, Linux, X64, secops_machine ]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[DEBUG] Step 1 — Checkout pwd and files"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE
          echo "=== Files in workspace ==="
          ls -la $GITHUB_WORKSPACE/
          echo "=== src/python contents ==="
          ls -la $GITHUB_WORKSPACE/src/python/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: "[DEBUG] Step 2 — Docker info"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Docker version ==="
          docker --version
          echo "=== Running containers ==="
          docker ps
          echo "=== Existing images ==="
          docker images | grep python

      - name: Build Python app image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/src/python
          file: ${{ github.workspace }}/src/python/Dockerfile
          push: false
          tags: python-app:dast
          load: true

      - name: "[DEBUG] Step 3 — After build"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Docker images after build ==="
          docker images | grep python
          echo "=== Workspace files ==="
          ls -la $GITHUB_WORKSPACE/

      - name: Start Python app container
        run: |
          echo "=== PWD ==="
          pwd
          docker rm -f python-app 2>/dev/null || true
          docker run -d \
            --name python-app \
            -p 5001:5000 \
            -e FLASK_DEBUG=false \
            python-app:dast
          echo "Waiting for app to be ready..."
          sleep 5
          echo "=== Container status ==="
          docker ps | grep python-app

      - name: Health check
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Testing connectivity ==="
          for i in {1..10}; do
            echo "Attempt $i: curl http://localhost:5001/"
            if curl -sf http://localhost:5001/ && curl -sf http://localhost:5001/health; then
              echo "App is up"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "App failed to start"
          echo "=== Container logs ==="
          docker logs python-app
          echo "=== Container inspect (ports) ==="
          docker inspect python-app | grep -A 10 "Ports"
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        env:
          ZAP_REPORT_DIR: ${{ github.workspace }}
        with:
          target: "http://localhost:5001"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I -J ${{ github.workspace }}/zap_results.json"
          artifact_name: zap-python-report
          issue_title: "DAST — Python app ZAP findings"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "[DEBUG] Step 4 — After ZAP scan"
        if: always()
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE
          echo "=== All files in workspace ==="
          ls -la $GITHUB_WORKSPACE/
          echo "=== Search for any ZAP output files ==="
          find $GITHUB_WORKSPACE -name "zap*" -o -name "*.sarif" -o -name "*.json" 2>/dev/null
          echo "=== Container still running? ==="
          docker ps | grep python-app || echo "container stopped"

      - name: Convert ZAP JSON to SARIF
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Files before conversion ==="
          ls -la
          python3 << 'PYEOF'
          import json, os

          workspace  = os.environ.get("GITHUB_WORKSPACE", ".")
          report_file = os.path.join(workspace, "zap_results.json")
          sarif_file  = os.path.join(workspace, "zap_sarif.sarif")

          print(f"Looking for ZAP report at: {report_file}")
          print(f"Will write SARIF to: {sarif_file}")

          sarif = {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "OWASP ZAP",
                  "version": "2.x",
                  "rules": []
                }
              },
              "results": []
            }]
          }

          if not os.path.exists(report_file):
            print(f"WARNING: No ZAP JSON report found at {report_file}")
            print(f"Files in workspace: {os.listdir(workspace)}")
            with open(sarif_file, "w") as f:
              json.dump(sarif, f)
            exit(0)

          with open(report_file) as f:
            zap = json.load(f)

          rules = {}
          results = []

          for site in zap.get("site", []):
            for alert in site.get("alerts", []):
              rule_id   = alert.get("pluginid", "unknown")
              rule_name = alert.get("alert", "Unknown")
              risk      = alert.get("riskcode", "1")

              severity_map = {"3": "error", "2": "warning", "1": "note", "0": "none"}
              severity = severity_map.get(str(risk), "warning")

              if rule_id not in rules:
                rules[rule_id] = {
                  "id": rule_id,
                  "name": rule_name,
                  "shortDescription": {"text": rule_name},
                  "helpUri": alert.get("reference", "https://www.zaproxy.org/"),
                  "properties": {"problem.severity": severity}
                }

              for instance in alert.get("instances", [{}]):
                results.append({
                  "ruleId": rule_id,
                  "level": severity,
                  "message": {"text": alert.get("desc", rule_name)},
                  "locations": [{
                    "physicalLocation": {
                      "artifactLocation": {
                        "uri": instance.get("uri", site.get("@name", "unknown"))
                      }
                    }
                  }]
                })

          sarif["runs"][0]["tool"]["driver"]["rules"] = list(rules.values())
          sarif["runs"][0]["results"] = results

          with open(sarif_file, "w") as f:
            json.dump(sarif, f, indent=2)

          print(f"SARIF written to: {sarif_file}")
          print(f"Findings: {len(results)}, Rules: {len(rules)}")
          PYEOF
          echo "=== Files after conversion ==="
          ls -la

      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/zap_sarif.sarif
          category: dast-python

      - name: Stop app container
        if: always()
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Stopping container ==="
          docker stop python-app && docker rm python-app
          echo "=== Remaining containers ==="
          docker ps
