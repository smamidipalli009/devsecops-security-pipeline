name: Python — DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: [ "Python — SCA (Trivy)" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dast-zap-python:
    name: OWASP ZAP — Python app
    runs-on: [ self-hosted, Linux, X64, secops_machine ]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python app image
        uses: docker/build-push-action@v6
        with:
          context: src/python
          file: src/python/Dockerfile
          push: false
          tags: python-app:dast
          load: true

      # Port 5001 — avoids conflict with anything already running on 5000
      # on this self-hosted runner (e.g. AirPlay, other services)
      - name: Start Python app container
        run: |
          docker rm -f python-app 2>/dev/null || true
          docker run -d \
            --name python-app \
            -p 5001:5000 \
            -e FLASK_DEBUG=false \
            python-app:dast
          echo "Waiting for app to be ready..."
          sleep 5

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl -sf http://localhost:5001/health; then
              echo "App is up"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 3s..."
            sleep 3
          done
          echo "App failed to start"
          docker logs python-app
          exit 1

      # ZAP baseline scan against port 5001
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5001"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          artifact_name: zap-python-report
          issue_title: "DAST — Python app ZAP findings"

      # Upload ZAP SARIF — ZAP action writes to results.sarif in workspace root
      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: dast-python

      - name: Stop app container
        if: always()
        run: docker stop python-app && docker rm python-app
