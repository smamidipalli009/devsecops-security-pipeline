name: Python — DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: [ "Python — SCA (Trivy)" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dast-zap-python:
    name: OWASP ZAP — Python app
    runs-on: [ self-hosted, Linux, X64, secops_machine ]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "[DEBUG] Step 1 — Verify workspace and source files"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE
          echo "=== src/python contents ==="
          ls -la $GITHUB_WORKSPACE/src/python/

      - name: "[DEBUG] Step 2 — Docker info and cleanup"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Docker version ==="
          docker --version
          echo "=== Running containers ==="
          docker ps
          echo "=== Removing stale python-app container if exists ==="
          docker rm -f python-app 2>/dev/null || true
          echo "=== Existing python images ==="
          docker images | grep python || echo "no python images found"

      - name: Build Python app image
        run: |
          echo "=== PWD before cd ==="
          pwd
          cd $GITHUB_WORKSPACE/src/python
          echo "=== PWD after cd ==="
          pwd
          echo "=== Files in build context ==="
          ls -la
          echo "=== Building Docker image ==="
          docker build -t python-app:dast .
          echo "=== Build complete — verifying image ==="
          docker images | grep python-app

      - name: "[DEBUG] Step 3 — After build"
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== All Docker images ==="
          docker images | grep python-app
          echo "=== Workspace files ==="
          ls -la $GITHUB_WORKSPACE/

      - name: Start Python app container
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== Starting container on port 5001 ==="
          docker run -d \
            --name python-app \
            -p 5001:5000 \
            -e FLASK_DEBUG=false \
            python-app:dast
          echo "=== Waiting 5s for app to start ==="
          sleep 5
          echo "=== Container status ==="
          docker ps | grep python-app
          echo "=== Container logs so far ==="
          docker logs python-app

      - name: Health check
        run: |
          echo "=== PWD ==="
          pwd
          for i in {1..10}; do
            echo "Attempt $i: hitting http://localhost:5001/health"
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5001/health)
            echo "HTTP status: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "App is up and healthy"
              exit 0
            fi
            echo "Not ready yet, retrying in 3s..."
            sleep 3
          done
          echo "=== App failed to start — full container logs ==="
          docker logs python-app
          echo "=== Port bindings ==="
          docker inspect python-app | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d[0]['NetworkSettings']['Ports'], indent=2))"
          exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:5001/"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-I"
          issue_title: "DAST — Python app ZAP findings"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "[DEBUG] Step 4 — After ZAP scan"
        if: always()
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== All files in workspace ==="
          ls -la $GITHUB_WORKSPACE/
          echo "=== Search for ZAP output files ==="
          find $GITHUB_WORKSPACE -name "zap*" -o -name "*.sarif" -o -name "*.json" 2>/dev/null
          echo "=== Container still running? ==="
          docker ps | grep python-app || echo "container stopped"

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          echo "=== PWD ==="
          pwd
          cd $GITHUB_WORKSPACE
          echo "=== Files before conversion ==="
          ls -la
          python3 << 'PYEOF'
          import json, os

          workspace   = os.environ.get("GITHUB_WORKSPACE", ".")
          report_file = os.path.join(workspace, "report_json.json")
          sarif_file  = os.path.join(workspace, "zap_sarif.sarif")

          print(f"Looking for ZAP report at: {report_file}")
          print(f"Will write SARIF to:       {sarif_file}")

          sarif = {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [{
              "tool": {"driver": {"name": "OWASP ZAP", "version": "2.x", "rules": []}},
              "results": []
            }]
          }

          # Check file exists AND is not empty
          if not os.path.exists(report_file) or os.path.getsize(report_file) == 0:
            print(f"WARNING: ZAP JSON not found. Files in workspace: {os.listdir(workspace)}")
            with open(sarif_file, "w") as f:
              json.dump(sarif, f)
            exit(0)

          with open(report_file) as f:
            zap = json.load(f)

          rules, results = {}, []
          for site in zap.get("site", []):
            for alert in site.get("alerts", []):
              rule_id   = alert.get("pluginid", "unknown")
              rule_name = alert.get("alert", "Unknown")
              severity  = {"3":"error","2":"warning","1":"note","0":"none"}.get(str(alert.get("riskcode","1")), "warning")
              if rule_id not in rules:
                rules[rule_id] = {
                  "id": rule_id, "name": rule_name,
                  "shortDescription": {"text": rule_name},
                  "helpUri": alert.get("reference", "https://www.zaproxy.org/"),
                  "properties": {"problem.severity": severity}
                }
              for instance in alert.get("instances", [{}]):
                results.append({
                  "ruleId": rule_id, "level": severity,
                  "message": {"text": alert.get("desc", rule_name)},
                  "locations": [{"physicalLocation": {"artifactLocation": {
                    "uri": instance.get("uri", site.get("@name", "unknown"))
                  }}}]
                })

          sarif["runs"][0]["tool"]["driver"]["rules"] = list(rules.values())
          sarif["runs"][0]["results"] = results
          with open(sarif_file, "w") as f:
            json.dump(sarif, f, indent=2)
          print(f"SARIF written: {len(results)} findings, {len(rules)} rules")
          PYEOF
          echo "=== Files after conversion ==="
          ls -la $GITHUB_WORKSPACE/

      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/zap_sarif.sarif
          category: dast-python

      - name: Stop app container
        if: always()
        run: |
          echo "=== Stopping and removing container ==="
          docker stop python-app && docker rm python-app || true
          echo "=== Remaining containers ==="
          docker ps
