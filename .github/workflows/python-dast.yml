name: Python - DAST (OWASP ZAP)

on:
  workflow_run:
    workflows: ["Python - SCA (Trivy)"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  dast-zap-python:
    name: OWASP ZAP - Python app
    runs-on: [self-hosted, Linux, X64, secops_machine]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify workspace
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          ls -la $GITHUB_WORKSPACE/
          ls -la $GITHUB_WORKSPACE/src/python/
          ls -la $GITHUB_WORKSPACE/.zap/
          ls -la $GITHUB_WORKSPACE/scripts/

      - name: Cleanup stale containers and images
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          docker rm -f python-app 2>/dev/null || true
          docker rmi -f python-app:dast 2>/dev/null || true
          docker ps
          docker images | grep python || echo "no python images"

      - name: Build Python app image
        run: |
          cd $GITHUB_WORKSPACE/src/python
          echo "PWD=$(pwd)"
          ls -la
          docker build -t python-app:dast .
          docker images | grep python-app

      - name: Start Python app container
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          docker run -d --name python-app -p 5001:5000 -e FLASK_DEBUG=false python-app:dast
          sleep 5
          docker ps | grep python-app
          docker logs python-app

      - name: Health check
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          for i in {1..10}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:5001/health)
            echo "Attempt $i - HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "App is healthy"
              exit 0
            fi
            sleep 3
          done
          docker logs python-app
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          touch zap_report.json zap_report.html zap_report.md
          chmod a+w zap_report.json zap_report.html zap_report.md
          docker run --rm \
            --network host \
            -v $GITHUB_WORKSPACE:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5001/ \
            -J zap_report.json \
            -r zap_report.html \
            -w zap_report.md \
            -I \
            -c .zap/rules.tsv || true
          echo "After ZAP:"
          ls -la $GITHUB_WORKSPACE/
          wc -c $GITHUB_WORKSPACE/zap_report.json

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          ls -la $GITHUB_WORKSPACE/
          python3 $GITHUB_WORKSPACE/scripts/zap_to_sarif.py
          ls -la $GITHUB_WORKSPACE/

      - name: Upload ZAP SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/zap_sarif.sarif
          category: dast-python


      - name: Upload ZAP reports as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: |
            ${{ github.workspace }}/zap_report.json
            ${{ github.workspace }}/zap_report.html
            ${{ github.workspace }}/zap_report.md
            ${{ github.workspace }}/zap_sarif.sarif
          retention-days: 14

      - name: Stop app container
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          echo "PWD=$(pwd)"
          docker stop python-app && docker rm python-app || true
          docker ps
